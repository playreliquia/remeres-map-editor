# Loaded on top of mise.toml when MISE_ENV=ci. Run `MISE_ENV=ci mise run <task>` to reproduce a
# ci job's environment locally.

[settings]
# The workflow installs the tools a job needs; a task must use those and never install more.
task.run_auto_install = false

[env]
# ci persists these directories with actions/cache, keyed per OS. A job that sets
# VCPKG_NUGET_SOURCE (the Windows build) also reads and writes the org's NuGet feed.
VCPKG_BINARY_SOURCES = "clear;files,{{config_root}}/.cache/vcpkg,readwrite{{ get_env(name='VCPKG_NUGET_SOURCE', default='') }}"
CCACHE_DIR = "{{config_root}}/.cache/ccache"
CCACHE_BASEDIR = "{{config_root}}"
CCACHE_MAXSIZE = "1G"
SCCACHE_DIR = "{{config_root}}/.cache/sccache"
SCCACHE_CACHE_SIZE = "1G"
