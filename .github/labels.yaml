# The repository's labels, synced by .github/workflows/issues.yml. Edit here, never on GitHub.
# Sync runs with delete-other-labels: false, so a label removed from this file stays on
# GitHub until it is deleted by hand.

# Renovate
- name: dependencies
  color: "0366d6"

# Renovate update types
- name: type/digest
  color: "ffec19"
- name: type/patch
  color: "ffec19"
- name: type/minor
  color: "ff9800"
- name: type/major
  color: "f6412d"

# release-please
- name: "autorelease: pending"
  color: "ededed"
- name: "autorelease: tagged"
  color: "ededed"

# Lifecycle
- name: stale
  color: "795548"

# Issue types, kept from upstream's defaults
- name: accessibility
  color: "f143ab"
  description: Barrier affecting people with disabilities
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: question
  color: "d876e3"
  description: Further information is requested
- name: wontfix
  color: "ffffff"
  description: This will not be worked on

# Triage
- name: needs-triage
  color: "fbca04"
  description: Maintainer needs to evaluate this issue
- name: needs-info
  color: "d876e3"
  description: Waiting on reporter for more information
- name: ready-for-agent
  color: "0e8a16"
  description: Fully specified, ready for an AFK agent
- name: ready-for-human
  color: "1d76db"
  description: Requires human implementation

# Wayfinder
- name: wayfinder:map
  color: "0e8a16"
  description: "Wayfinder map: the index of an effort"
- name: wayfinder:grilling
  color: "5319e7"
  description: Wayfinder ticket resolved by conversation
- name: wayfinder:research
  color: "1d76db"
  description: Wayfinder ticket resolved by reading sources
- name: wayfinder:prototype
  color: "fbca04"
  description: Wayfinder ticket resolved by a throwaway artifact
- name: wayfinder:task
  color: "d93f0b"
  description: "Wayfinder ticket: manual work a decision waits on"
