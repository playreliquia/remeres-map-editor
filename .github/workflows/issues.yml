name: Issues

# Keeps the repository's labels in line with .github/labels.yaml: a listed label edited by hand
# is reverted on the next run. Labels missing from the file are left alone, so a label added
# by hand survives until someone deletes it.
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/labels.yaml
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC

permissions:
  contents: read

jobs:
  label-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.yaml

      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yaml
          delete-other-labels: false
