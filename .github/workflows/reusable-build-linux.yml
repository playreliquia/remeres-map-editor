name: Reusable Linux Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      # Pruning the per-run vcpkg caches.
      actions: write
    name: Compile (linux-release)
    runs-on: ubuntu-24.04
    env:
      # The Actions cache below holds the files source. Unlike Windows this skips the NuGet
      # feed: nuget.exe needs mono here, which costs minutes to install.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # What mise cannot provide: GCC 14, which preset.sh selects, autotools for the vcpkg ports
      # that use them, and the GTK, X11 and OpenGL headers wxWidgets builds against.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            gcc-14 \
            g++-14 \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            libltdl-dev \
            libtool \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxmu-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            libxxf86vm-dev \
            linux-libc-dev \
            mesa-common-dev \
            pkg-config \
            python3-venv

      # The build needs only these; the lint tools stay out of the build jobs.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: cmake ninja ccache

      - uses: ./.github/actions/vcpkg-cache
        with:
          mode: restore
          os: linux

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-linux-release-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-release-${{ github.ref_name }}-
            ccache-linux-release-main-

      - name: Set up vcpkg
        run: mise run setup:vcpkg

      - name: Install vcpkg packages
        id: deps
        run: mkdir -p .cache/vcpkg && mise run build:deps

      - name: Build
        run: mise run build

      - name: Package
        run: mise run package

      - name: ccache statistics
        if: always()
        run: mise exec -- ccache --show-stats

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux
          path: dist/remeres-map-editor-*.zip
          if-no-files-found: error

      # A merge group's or a tag's caches sit under its own ref, which no later run can restore.
      - name: Save ccache
        if: always() && github.event_name != 'merge_group' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-linux-release-${{ github.ref_name }}-${{ github.sha }}

      # Saved even when the job fails, so the next attempt keeps what this one built. A merge
      # group's or a tag's caches sit under its own ref, which no later run can restore.
      - uses: ./.github/actions/vcpkg-cache
        if: always() && github.event_name != 'merge_group' && !startsWith(github.ref, 'refs/tags/')
        with:
          mode: save
          os: linux
          installed: ${{ steps.deps.outcome == 'success' && 'build/linux-release/vcpkg_installed' || '' }}
