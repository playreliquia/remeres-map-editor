name: Reusable Linux Build

on:
  workflow_call:

permissions:
  contents: read
  # Pruning the per-run vcpkg caches.
  actions: write

jobs:
  build:
    name: Compile (${{ matrix.buildtype }})
    strategy:
      fail-fast: false
      matrix:
        buildtype: [linux-release]
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      # The Actions cache below holds the files source. Unlike Windows this skips the NuGet
      # feed: nuget.exe needs mono here, which costs minutes to install.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/vcpkg-cache
        with:
          mode: restore
          os: linux

      - name: Get vcpkg baseline
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_commit_id="$(grep '.builtin-baseline' vcpkg.json | awk -F: '{print $2}' | tr -d '," ')"
          echo "VCPKG_GIT_COMMIT_ID=${vcpkg_commit_id}" >> "${GITHUB_ENV}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            ccache \
            gcc-14 \
            g++-14 \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            libltdl-dev \
            libtool \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxmu-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            libxxf86vm-dev \
            linux-libc-dev \
            mesa-common-dev \
            ninja-build \
            pkg-config \
            python3-venv
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          ninja --version

      - name: CCache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          max-size: "1G"
          key: ccache-linux-${{ matrix.buildtype }}
          restore-keys: |
            ccache-linux

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      # Its own step, so install time shows apart from the compile, and a compile failure
      # cannot hide an install success. CMake's configure then finds every package installed.
      - name: Install vcpkg packages
        # The preset's triplets.
        env:
          TRIPLET: x64-linux-release
        run: |
          set -euo pipefail
          mkdir -p .cache/vcpkg
          "${VCPKG_ROOT}/vcpkg" install \
            --x-install-root="build/${{ matrix.buildtype }}/vcpkg_installed" \
            --overlay-triplets=cmake/triplets \
            --triplet="${TRIPLET}" \
            --host-triplet="${TRIPLET}" \
            --clean-after-build

      - name: Run CMake
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956  # v10.9
        with:
          configurePreset: ${{ matrix.buildtype }}
          buildPreset: ${{ matrix.buildtype }}
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON', '-DOPTIONS_ENABLE_IPO=OFF']"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-${{ matrix.buildtype }}
          path: build/${{ matrix.buildtype }}/bin/

      # Saved even when the job fails, so the next attempt keeps what this one built. A merge
      # group's caches sit under its own ref, which no later run can restore.
      - uses: ./.github/actions/vcpkg-cache
        if: always() && github.event_name != 'merge_group'
        with:
          mode: save
          os: linux
