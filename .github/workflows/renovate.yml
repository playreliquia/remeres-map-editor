name: Renovate

# Self-hosted Renovate, as in reliquia: daily, on dispatch, and after a config change on main.
# A pull request that changes this file or .renovaterc.json5 gets a dry run instead.
"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - plan changes without opening PRs"
        type: boolean
        default: false
      log_level:
        description: "Log level (debug, info, warn, error)"
        default: info
        required: false
      version:
        description: "Renovate image tag to run instead of the pinned RENOVATE_VERSION, for example latest"
        default: ""
        required: false
  schedule:
    - cron: "23 2 * * *"  # daily; off the hour, which GitHub drops under load
  push:
    branches: [main]
    paths:
      - .renovaterc.json5
  # A same-repo PR runs the merge ref's workflow, so the dry-run job below exercises the
  # bumped action and the changed config. Nothing else on a PR runs this file.
  pull_request:
    paths:
      - .github/workflows/renovate.yml
      - .renovaterc.json5

concurrency:
  group: renovate-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The Renovate image both jobs run, by tag and digest. Renovate bumps it behind the three-day
  # release age, in one group with the renovate-config-validator hook in .pre-commit-config.yaml.
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.181.1@sha256:823dc5036b911696c27faacf7664219b28e6e15826405720df29aad208d19f25

jobs:
  # The App's secrets reach only this job, which runs on push, schedule and dispatch, never on
  # a pull request.
  renovate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      # Renovate authenticates as the org automation App so its PRs trigger workflows
      # (GITHUB_TOKEN-authored events do not) and the author is the App's bot user, not a
      # person.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          # Scoped down from the installation's grant to this repository: branches and PRs,
          # the dependency dashboard issue, action pins under .github/workflows, branch checks,
          # and the renovate/stability-days status it sets on its own branches
          # (minimumReleaseAge).
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: write

      # No mise setup step here: renovatebot/github-action runs Renovate inside its
      # container, which installs mise for the postUpgradeTasks in .renovaterc.json5 that
      # rewrite the root mise.lock with a tool bump.
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213  # v46.3.9
        with:
          # A dispatch with a version runs that tag; otherwise the pinned image.
          renovate-image: ${{ inputs.version && 'ghcr.io/renovatebot/renovate' || format('ghcr.io/renovatebot/renovate:{0}', env.RENOVATE_VERSION) }}
          renovate-version: ${{ inputs.version }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || 'false' }}
          RENOVATE_PLATFORM: github
          # The one postUpgradeTasks command, `mise lock` over one named mise tool. Tasks run
          # without a shell, so safe mode comes from the environment Renovate gives every child.
          RENOVATE_ALLOWED_COMMANDS: '["^mise lock [A-Za-z0-9:@/._-]+$"]'
          # Safe mode ignores the project's [settings], so npm.shell_out comes from here too;
          # without it `mise lock` points mise.lock at a sidecar under .mise/locks/ that
          # `mise install --locked` rejects.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"MISE_SAFE":"1","MISE_NPM_SHELL_OUT":"1"}'
          # The App's bot user; must match the token's identity or Renovate treats its
          # own branches as edited by someone else.
          RENOVATE_GIT_AUTHOR: "reliquia-automation[bot] <331776854+reliquia-automation[bot]@users.noreply.github.com>"

  # GITHUB_TOKEN only, read-only: a pull request never sees the App's secrets.
  dry-run:
    name: renovate dry run
    # A fork's branch is not in this repository, so Renovate could not check it out.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # A dry run still resolves each would-be PR's branch status; without these the
      # GitHub API answers 403 and Renovate exits non-zero.
      statuses: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            .renovaterc.json5

      # The pull request's .renovaterc.json5 goes in as the global config, and Renovate reads
      # no repository config. Merging it into main's config (useBaseBranchConfig) fails while
      # main has none, as on the pull request that adds it.
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213  # v46.3.9
        with:
          renovate-image: ghcr.io/renovatebot/renovate:${{ env.RENOVATE_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: .renovaterc.json5
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCH_PATTERNS: ${{ github.head_ref }}
          RENOVATE_REQUIRE_CONFIG: ignored
          RENOVATE_ONBOARDING: "false"
          RENOVATE_DRY_RUN: full
          RENOVATE_PLATFORM: github
          RENOVATE_ALLOWED_COMMANDS: '["^mise lock [A-Za-z0-9:@/._-]+$"]'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"MISE_SAFE":"1","MISE_NPM_SHELL_OUT":"1"}'
