name: CI

on:
  workflow_dispatch:
  # No path filter: `ci` is the required check, so it must report on every pull request.
  # The changes job still decides which builds run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "source/**"
      - "cmake/**"
      - "data/**"
      - "brushes/**"
      - "icons/**"
      - "scripts/**"
      - "tools/**"
      - "vcproj/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".clang-format"
      - ".yamllint.yaml"
      - ".reviewdog.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".mise/**"
      - "mise.lock"
      - ".pre-commit-config.yaml"
      - ".config/**"
      - ".editorconfig"
      - ".renovaterc.json5"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "docs/agents/**"
      - "docs/building/README.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Runs on main queue instead, so a newer run never prunes the vcpkg cache an older one saved
  # while it is still restoring from it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compile: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.compile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: |
            compile:
              - "src/**"
              - "source/**"
              - "cmake/**"
              - "data/**"
              - "brushes/**"
              - "icons/**"
              - "vcproj/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/actions/vcpkg-cache/**"
              - ".github/actions/setup-mise/**"
              - ".mise/**"
              - "mise.lock"
              - ".clang-format"
              - ".yamllint.yaml"
              - ".reviewdog.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-linux.yml"
              - ".github/workflows/reusable-build-macos.yml"
              - ".github/workflows/reusable-build-windows.yml"
              - ".github/workflows/reusable-checks.yml"
              - ".github/workflows/autofix-ci.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"

  # The fork's own lint over its tooling files; upstream's checks below cover the C++.
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  checks:
    name: Fast Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/reusable-checks.yml

  build-linux:
    name: Build - Linux
    needs: [changes, checks]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-linux.yml

  # macOS is not a first-class platform, so its build runs only on manual dispatch.
  build-macos:
    name: Build - macOS
    needs: [changes, checks]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.compile == 'true' && needs.checks.result == 'success'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-macos.yml

  # Two callers, because a reusable job cannot ask for more than its caller grants, even
  # when skipped. Only trusted events get packages: write and push to the shared NuGet feed;
  # pull requests and merge groups read it.
  build-windows:
    name: Build - Windows
    needs: [changes, checks]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      nuget: readwrite

  build-windows-pr:
    name: Build - Windows
    needs: [changes, checks]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      nuget: read

  # The single required check. It passes only when every job above succeeded or was skipped.
  ci:
    needs: [changes, lint, checks, build-linux, build-macos, build-windows, build-windows-pr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce conventional commit format on PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: ${PR_TITLE}"
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\(.+\))?(!)?: .+'
          if ! echo "${PR_TITLE}" | grep -Eq "${pattern}"; then
            echo "ERROR: PR title does not follow conventional commits."
            echo "Expected: <type>(<scope>): <description>"
            echo "Example:  fix(creatures): load lua definitions when directories change"
            exit 1
          fi
          echo "OK"

      - name: Check dependency results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "ERROR: a required job reported '${result}'"; exit 1 ;;
            esac
          done
          echo "OK"
