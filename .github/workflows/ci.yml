name: CI

on:
  workflow_dispatch:
  # No path filter: `ci` is the required check, so it must report on every pull request.
  # The changes job still decides which builds run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "source/**"
      - "cmake/**"
      - "data/**"
      - "brushes/**"
      - "icons/**"
      - "scripts/**"
      - "tools/**"
      - "vcproj/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".clang-format"
      - ".yamllint.yaml"
      - ".reviewdog.yml"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compile: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.compile }}
      docker: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            compile:
              - "src/**"
              - "source/**"
              - "cmake/**"
              - "data/**"
              - "brushes/**"
              - "icons/**"
              - "vcproj/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/actions/vcpkg-cache/**"
              - ".clang-format"
              - ".yamllint.yaml"
              - ".reviewdog.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-linux.yml"
              - ".github/workflows/reusable-build-macos.yml"
              - ".github/workflows/reusable-build-windows.yml"
              - ".github/workflows/reusable-checks.yml"
              - ".github/workflows/autofix-ci.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "src/**"
              - "source/**"
              - "cmake/**"
              - "data/**"
              - "brushes/**"
              - "icons/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-docker.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"

  checks:
    name: Fast Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit

  build-linux:
    name: Build - Linux
    needs: [changes, checks]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-linux.yml
    secrets: inherit

  build-macos:
    name: Build - macOS
    needs: [changes, checks]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-macos.yml
    secrets: inherit

  build-windows:
    name: Build - Windows
    needs: [changes, checks]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/reusable-build-windows.yml
    secrets: inherit

  build-docker:
    name: Build - Docker
    needs: [changes, checks]
    if: needs.changes.outputs.docker == 'true' && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-docker.yml
    secrets: inherit

  # The single required check. It passes only when every job above succeeded or was skipped.
  ci:
    needs: [changes, checks, build-linux, build-macos, build-windows, build-docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce conventional commit format on PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: ${PR_TITLE}"
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\(.+\))?(!)?: .+'
          if ! echo "${PR_TITLE}" | grep -Eq "${pattern}"; then
            echo "ERROR: PR title does not follow conventional commits."
            echo "Expected: <type>(<scope>): <description>"
            echo "Example:  fix(creatures): load lua definitions when directories change"
            exit 1
          fi
          echo "OK"

      - name: Check dependency results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "ERROR: a required job reported '${result}'"; exit 1 ;;
            esac
          done
          echo "OK"
