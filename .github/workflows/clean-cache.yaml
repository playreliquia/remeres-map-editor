---
name: Cleanup caches by branch

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        # gh's built-in cache commands. The gh-actions-cache extension listed no
        # keys, so closed PRs kept their caches, per-run vcpkg keys included.
        run: gh cache delete --all --ref "${BRANCH}" --repo "${REPO}" --succeed-on-no-caches
