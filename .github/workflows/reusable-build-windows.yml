name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      nuget:
        description: "Access to the org's vcpkg NuGet feed: `readwrite` on trusted events, `read` otherwise."
        type: string
        default: read

# No permissions block: the job takes its caller's, which ci.yml grants per event (packages:
# write only on trusted events; actions: write prunes the per-run vcpkg caches). A block here
# would have to name one packages scope for both callers.

jobs:
  build:
    name: Compile (windows-release)
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The mise tasks are bash scripts; Git Bash runs them.
    defaults:
      run:
        shell: bash
    env:
      # The Actions cache below holds the files source, which every run writes under its own
      # ref. The org's NuGet feed is shared by every ref and outside the 10 GB cache limit, so
      # Windows reads it too, and writes it on trusted events only.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,${{ inputs.nuget == 'readwrite' && 'readwrite' || 'read' }};nugettimeout,600"
      # GitHub Packages links a package pushed with GITHUB_TOKEN to this repository.
      VCPKG_NUGET_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # The build needs only these; the lint tools stay out of the build jobs. preset.sh loads
      # the runner's Visual Studio environment.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: cmake ninja sccache

      - uses: ./.github/actions/vcpkg-cache
        with:
          mode: restore
          os: windows

      - name: Restore sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/sccache
          key: sccache-windows-release-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-windows-release-${{ github.ref_name }}-
            sccache-windows-release-main-

      - name: Setup NuGet source for GitHub Packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: |
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) {
            throw "nuget.exe not found in PATH"
          }

          & $nuget sources remove -Name "GitHubPackages" 2>&1 | Out-Null
          & $nuget sources add `
            -Name "GitHubPackages" `
            -Source $feed `
            -UserName "${{ github.repository_owner }}" `
            -Password "$env:NUGET_AUTH_TOKEN" `
            -StorePasswordInClearText

          & $nuget setapikey "$env:NUGET_AUTH_TOKEN" -Source $feed
          & $nuget sources list

      - name: Set up vcpkg
        run: mise run setup:vcpkg

      - name: DIAG vcpkg abi
        run: |
          set +e -uo pipefail
          echo "image ${ImageVersion:-unknown}"
          args=(install --debug --x-install-root=build/windows-release/vcpkg_installed --overlay-triplets=cmake/triplets --triplet=x64-windows-static-release --host-triplet=x64-windows)
          echo "=== step env: which cmake: $(command -v cmake)"
          (source .mise/lib/preset.sh; "${VCPKG_ROOT}/vcpkg" "${args[@]}" --dry-run > "${RUNNER_TEMP}/dry-step.log" 2>&1)
          echo "=== mise exec env: which cmake: $(mise exec -- bash -c 'command -v cmake')"
          mise exec -- bash -c 'source .mise/lib/preset.sh; timeout 240 "${VCPKG_ROOT}/vcpkg" "$@" > "${RUNNER_TEMP}/real-mise.log" 2>&1' _ "${args[@]}"
          for f in dry-step real-mise; do
            echo "##### ${f}"
            grep -n 'Restored\|package ABI\|Found path\|cmake.exe" --version\|Feature flag\|will be built\|will be restored\|Error' "${RUNNER_TEMP}/${f}.log" | grep -v '^.*PATH=' | head -40
            awk '/abientries for vcpkg-cmake:x64-windows>/{f=1} f{print} /<\/abientries>/{if(f)exit}' "${RUNNER_TEMP}/${f}.log"
          done
          exit 1

      # The log feeds the push check below.
      - name: Install vcpkg packages
        run: |
          set -euo pipefail
          mkdir -p .cache/vcpkg
          mise run build:deps 2>&1 | tee "${RUNNER_TEMP}/vcpkg-install.log"

      - name: Build
        run: mise run build

      - name: Package
        run: mise run package

      - name: sccache statistics
        if: always()
        run: mise exec -- sccache --show-stats

      # vcpkg reports a failed push as a warning and carries on, so a feed the token cannot
      # write would go unnoticed. Packages linked to another repository answer 403 until the
      # maintainer grants this repository write access to them.
      - name: Verify vcpkg binary cache push
        if: success() && inputs.nuget == 'readwrite'
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/vcpkg-install.log"
          if (Select-String -Path $log -Pattern "to 0 binary cache\(s\)" -Quiet) {
            Write-Error "vcpkg submitted packages to 0 binary caches."
            exit 1
          }
          $failed = @(Select-String -Path $log -Pattern "while pushing NuGet package")
          if ($failed.Count -gt 0) {
            Write-Output "::warning::$($failed.Count) NuGet push(es) failed; the install step's log names each package."
          }
          if (Select-String -Path $log -Pattern "to [1-9][0-9]* binary cache\(s\)" -Quiet) {
            Write-Output "vcpkg submitted the packages it built to the binary caches."
          } else {
            Write-Output "Every package came from a binary cache; nothing to push."
          }

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: dist/remeres-map-editor-*.zip
          if-no-files-found: error

      # A merge group's caches sit under its own ref, which no later run can restore.
      - name: Save sccache
        if: always() && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/sccache
          key: sccache-windows-release-${{ github.ref_name }}-${{ github.sha }}

      # Saved even when the job fails, so the next attempt keeps what this one built. A merge
      # group's caches sit under its own ref, which no later run can restore.
      - uses: ./.github/actions/vcpkg-cache
        if: always() && github.event_name != 'merge_group'
        with:
          mode: save
          os: windows
